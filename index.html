<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apotek Sehat Premium | Digital Healthcare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-text {
            background: linear-gradient(to right, #059669, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Animasi masuk */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">

    <!-- DEKORASI BACKGROUND -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-100 rounded-full blur-[100px] opacity-50"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-blue-100 rounded-full blur-[100px] opacity-50"></div>
    </div>

    <!-- NAVBAR PREMIUM -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-600 p-2 rounded-xl shadow-lg shadow-emerald-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.628.292a2 2 0 01-1.631 0l-.628-.292a6 6 0 00-3.86-.517l-2.387.477a2 2 0 00-1.022.547l-.34.34a2 2 0 000 2.828l1.245 1.245a2 2 0 002.828 0L22 13V11a2 2 0 00-2-2h-5V7a3 3 0 00-3-3H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2l.34-.34z" />
                    </svg>
                </div>
                <span class="text-2xl font-extrabold tracking-tighter text-slate-900">Health<span class="text-emerald-600 italic">Sync.</span></span>
            </div>
            
            <!-- SEARCH BAR BOX -->
            <div class="hidden md:flex relative w-1/3">
                <input type="text" id="searchInput" onkeyup="cariObat()" 
                       placeholder="Cari kebutuhan medis Anda..." 
                       class="w-full bg-white/50 border border-slate-200 rounded-2xl py-3 px-12 focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 outline-none transition-all duration-300 shadow-sm">
                <div class="absolute left-4 top-3.5 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleKeranjang()" class="relative p-3 bg-white border border-slate-100 rounded-2xl hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group">
                    <span class="text-xl group-hover:scale-110 inline-block transition">🛒</span>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg border-2 border-white shadow-lg">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="max-w-7xl mx-auto px-6 py-12 text-center fade-in">
        <h1 class="text-4xl md:text-6xl font-black text-slate-900 mb-4 leading-tight">
            Solusi Kesehatan <br><span class="gradient-text">Tercepat & Terpercaya.</span>
        </h1>
        <p class="text-slate-500 max-w-2xl mx-auto text-lg mb-10">
            Dapatkan akses ke ribuan obat-obatan asli dan suplemen harian dengan layanan pengiriman ekspres ke rumah Anda.
        </p>
    </header>

    <!-- KATALOG -->
    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                Katalog Produk <span class="w-10 h-[2px] bg-emerald-500 rounded-full"></span>
            </h2>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Data akan dimuat JavaScript -->
        </div>
    </main>

    <!-- KERANJANG SIDEBAR -->
    <div id="cartSidebar" class="fixed inset-y-0 right-0 w-full md:w-[400px] bg-white shadow-[-20px_0_50px_rgba(0,0,0,0.05)] z-[100] transform translate-x-full transition-transform duration-500 ease-in-out border-l border-slate-100 flex flex-col">
        <div class="p-8 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
            <h2 class="text-2xl font-black text-slate-900">Pesanan Saya</h2>
            <button onclick="toggleKeranjang()" class="w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-md text-slate-400 hover:text-red-500 transition">✕</button>
        </div>
        
        <div id="cartItems" class="flex-grow overflow-y-auto p-8 space-y-6">
            <!-- Item -->
        </div>

        <div class="p-8 border-t border-slate-100 bg-white shadow-[0_-10px_30px_rgba(0,0,0,0.02)]">
            <div class="flex justify-between font-black text-xl mb-8">
                <span class="text-slate-400 font-medium">Total:</span>
                <span id="cartTotal" class="text-emerald-600 font-extrabold uppercase tracking-tight text-2xl">Rp 0</span>
            </div>
            <button onclick="kirimPesanan()" class="w-full bg-slate-900 text-white py-5 rounded-[2rem] font-bold hover:bg-emerald-600 hover:shadow-2xl hover:shadow-emerald-200 transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-3">
                <span>Konfirmasi Pesanan</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // DATA OBAT PREMIUM
        const daftarObat = [
            { id: 1, nama: "Paracetamol 500mg", harga: 15000, kategori: "Obat Umum", deskripsi: "Meredakan demam dan nyeri ringan dalam sekejap.", gambar: "💊" },
            { id: 2, nama: "Pure Vitamin C 1000", harga: 45000, kategori: "Immunity", deskripsi: "Meningkatkan daya tahan tubuh dari radikal bebas.", gambar: "🍊" },
            { id: 3, nama: "Silver Cough Syrup", harga: 28000, kategori: "Pernapasan", deskripsi: "Formula khusus untuk batuk berdahak membandel.", gambar: "🧪" },
            { id: 4, nama: "Pro Mask 3-Ply", harga: 35000, kategori: "Proteksi", deskripsi: "Filtrasi 99% bakteri untuk keamanan harian.", gambar: "😷" },
            { id: 5, nama: "Deep Antiseptic", harga: 18000, kategori: "P3K", deskripsi: "Membersihkan luka tanpa rasa perih berlebih.", gambar: "🩹" },
            { id: 6, nama: "Baby Care Oil", harga: 32000, kategori: "Baby", deskripsi: "Kehangatan lembut untuk sang buah hati tercinta.", gambar: "🧴" },
            { id: 7, nama: "Calcium Bone Pro", harga: 60000, kategori: "Supplement", deskripsi: "Menjaga kepadatan tulang dan gigi di masa tua.", gambar: "🦴" },
            { id: 8, nama: "First Aid Kit Pro", harga: 120000, kategori: "Kesehatan", deskripsi: "Kotak P3K lengkap untuk kebutuhan darurat rumah.", gambar: "💼" }
        ];

        let keranjang = [];

        function renderProduk(data) {
            const grid = document.getElementById('productGrid');
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-24 text-slate-300 font-bold text-xl italic tracking-tighter uppercase">Barang tidak ditemukan...</div>`;
                return;
            }
            grid.innerHTML = data.map(obat => `
                <div class="group bg-white rounded-[2.5rem] p-6 border border-slate-100 hover:shadow-[0_20px_50px_rgba(0,0,0,0.05)] hover:-translate-y-2 transition-all duration-500 fade-in">
                    <div class="h-48 bg-slate-50/50 rounded-[2rem] mb-6 flex items-center justify-center text-7xl group-hover:scale-110 transition duration-500">
                        ${obat.gambar}
                    </div>
                    <span class="px-4 py-1.5 bg-emerald-50 text-emerald-600 text-[10px] font-black uppercase tracking-widest rounded-full">${obat.kategori}</span>
                    <h3 class="font-bold text-xl text-slate-900 mt-4 leading-tight">${obat.nama}</h3>
                    <p class="text-sm text-slate-400 mt-2 line-clamp-2">${obat.deskripsi}</p>
                    <div class="flex justify-between items-center mt-8 pt-6 border-t border-slate-50">
                        <span class="font-black text-slate-900 text-lg tracking-tighter">Rp ${obat.harga.toLocaleString('id-ID')}</span>
                        <button onclick="masukKeranjang(${obat.id})" class="bg-emerald-600 text-white p-3 px-6 rounded-2xl text-xs font-black uppercase tracking-widest hover:bg-slate-900 hover:shadow-xl hover:shadow-emerald-200 transition-all duration-300">
                            + Tambah
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function cariObat() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const hasil = daftarObat.filter(o => 
                o.nama.toLowerCase().includes(keyword) || o.kategori.toLowerCase().includes(keyword)
            );
            renderProduk(hasil);
        }

        function toggleKeranjang() {
            document.getElementById('cartSidebar').classList.toggle('translate-x-full');
        }

        function masukKeranjang(id) {
            const item = daftarObat.find(o => o.id === id);
            keranjang.push(item);
            updateKeranjangUI();
        }

        function updateKeranjangUI() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            const cartCount = document.getElementById('cartCount');

            cartCount.innerText = keranjang.length;

            if (keranjang.length === 0) {
                cartItems.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center py-20">
                    <span class="text-6xl mb-4">🧺</span>
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Keranjang Anda Kosong</p>
                </div>`;
                cartTotal.innerText = "Rp 0";
                return;
            }

            let total = 0;
            cartItems.innerHTML = keranjang.map((item, index) => {
                total += item.harga;
                return `
                    <div class="flex items-center gap-5 p-4 rounded-3xl hover:bg-slate-50 transition duration-300 group">
                        <div class="w-16 h-16 bg-white shadow-sm border border-slate-50 rounded-2xl flex items-center justify-center text-3xl">
                            ${item.gambar}
                        </div>
                        <div class="flex-grow">
                            <h4 class="font-bold text-slate-800">${item.nama}</h4>
                            <p class="text-sm text-emerald-600 font-black tracking-tight">Rp ${item.harga.toLocaleString('id-ID')}</p>
                        </div>
                        <button onclick="hapusItem(${index})" class="text-slate-200 hover:text-red-500 transition">✕</button>
                    </div>
                `;
            }).join('');
            
            cartTotal.innerText = "Rp " + total.toLocaleString('id-ID');
        }

        function hapusItem(index) {
            keranjang.splice(index, 1);
            updateKeranjangUI();
        }

        function kirimPesanan() {
            if (keranjang.length === 0) return alert("Ups! Keranjang masih kosong.");
            const nomorWA = "628123456789"; 
            let pesan = "Halo HealthSync, saya ingin memesan:\n\n";
            let total = 0;
            keranjang.forEach((item, i) => {
                pesan += `🔹 ${item.nama} (Rp ${item.harga.toLocaleString('id-ID')})\n`;
                total += item.harga;
            });
            pesan += `\n*TOTAL PEMBAYARAN: Rp ${total.toLocaleString('id-ID')}*`;
            window.open(`https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`, '_blank');
        }

        renderProduk(daftarObat);
    </script>
</body>
</html>
