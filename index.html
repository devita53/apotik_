            <p class="text-slate-500 text-sm mb-6">Terima kasih <span id="invName" class="font-bold"></span>, pesanan Anda sedang kami siapkan.</p>
            <div class="bg-slate-50 p-4 rounded-xl mb-6 text-left text-sm space-y-1">
                <p>ID Pesanan: <span class="font-mono font-bold">#HS-992<?php echo rand(10,99); ?></span></p>
                <p>Total Bayar: <span id="invTotal" class="font-bold text-emerald-600"></span></p>

            <button onclick="window.location.reload()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold uppercase tracking-widest text-xs">Selesai & Tutup</button>

    <script>
        // 1. DATA OBAT (20 PRODUK)
        const daftarObat = [
            { id: 1, nama: "Paracetamol 500mg", harga: 15000, kategori: "Obat Umum", gambar: "💊" },
            { id: 2, nama: "Vitamin C 1000mg", harga: 45000, kategori: "Suplemen", gambar: "🍊" },
            { id: 3, nama: "Obat Batuk Sirup", harga: 28000, kategori: "Pernapasan", gambar: "🧪" },
            { id: 4, nama: "Masker Medis 3-Ply", harga: 35000, kategori: "Proteksi", gambar: "😷" },
            { id: 5, nama: "Minyak Kayu Putih", harga: 22000, kategori: "Kesehatan", gambar: "🧴" },
            { id: 6, nama: "Betadine 15ml", harga: 18000, kategori: "P3K", gambar: "🩹" },
            { id: 7, nama: "Suplemen Kalsium", harga: 60000, kategori: "Suplemen", gambar: "🦴" },
            { id: 8, nama: "Antimo Tablet", harga: 10000, kategori: "Mual", gambar: "💊" },
            { id: 9, nama: "Bodrex Sakit Kepala", harga: 5000, kategori: "Obat Umum", gambar: "💊" },
            { id: 10, nama: "Promag Tablet", harga: 12000, kategori: "Pencernaan", gambar: "🧪" },
            { id: 11, nama: "Sanaflu", harga: 14000, kategori: "Flu & Batuk", gambar: "💊" },
            { id: 12, nama: "Insto Tetes Mata", harga: 17000, kategori: "Mata", gambar: "👁️" },
            { id: 13, nama: "Salonpas Koyo", harga: 8000, kategori: "Otot", gambar: "🩹" },
            { id: 14, nama: "Enervon-C", harga: 40000, kategori: "Suplemen", gambar: "🍊" },
            { id: 15, nama: "Hansaplast Kain", harga: 5000, kategori: "P3K", gambar: "🩹" },
            { id: 16, nama: "Dettol Cair 250ml", harga: 55000, kategori: "Sanitasi", gambar: "🧴" },
            { id: 17, nama: "Diapet Kapsul", harga: 11000, kategori: "Pencernaan", gambar: "💊" },
            { id: 18, nama: "Komix Herbal", harga: 15000, kategori: "Pernapasan", gambar: "🧪" },
            { id: 19, nama: "Kasa Steril", harga: 7000, kategori: "P3K", gambar: "🩹" },
            { id: 20, nama: "Termometer Digital", harga: 85000, kategori: "Alat Medis", gambar: "🌡️" }
        ];

        let keranjang = [];

        function renderProduk(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = data.map(o => `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition duration-300 fade-in">
                    <div class="h-40 bg-slate-50 rounded-2xl mb-4 flex items-center justify-center text-6xl">${o.gambar}</div>
                    <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">${o.kategori}</span>
                    <h3 class="font-bold text-slate-800 mt-1">${o.nama}</h3>
                    <div class="flex justify-between items-center mt-6">
                        <span class="font-extrabold text-slate-900">Rp ${o.harga.toLocaleString('id-ID')}</span>
                        <button onclick="tambahKeKeranjang(${o.id})" class="bg-emerald-600 text-white py-2 px-4 rounded-xl text-xs font-bold hover:bg-slate-900 transition">+ Beli</button>
                    </div>
                </div>
            `).join('');
        }

        function cariObat() {
            const k = document.getElementById('searchInput').value.toLowerCase();
            renderProduk(daftarObat.filter(o => o.nama.toLowerCase().includes(k) || o.kategori.toLowerCase().includes(k)));
        }

        function toggleKeranjang() { document.getElementById('cartSidebar').classList.toggle('translate-x-full'); }

        function tambahKeKeranjang(id) {
            keranjang.push(daftarObat.find(o => o.id === id));
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = keranjang.length;
            const itemBox = document.getElementById('cartItems');
            let total = 0;
            itemBox.innerHTML = keranjang.map((o, index) => {
                total += o.harga;
                return `<div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                    <div class="text-sm font-bold">${o.nama}</div>
                    <button onclick="hapusItem(${index})" class="text-red-400 text-xs">Hapus</button>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function hapusItem(i) { keranjang.splice(i, 1); updateCart(); }

        // PEMESANAN TANPA WA
        function showCheckoutForm() {
            if(keranjang.length === 0) return alert("Keranjang masih kosong!");
            toggleKeranjang();
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); }

        function prosesPesanan(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const total = document.getElementById('cartTotal').innerText;
            
            closeCheckout();
            document.getElementById('invName').innerText = name;
            document.getElementById('invTotal').innerText = total;
            document.getElementById('invoiceModal').classList.remove('hidden');
        }

        renderProduk(daftarObat);
    </script>
</body>
</html>
